name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          rubygems: latest
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager --except EOLRails

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          rubygems: latest
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          rubygems: latest
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y google-chrome-stable curl libjemalloc2 libvips postgresql-client

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          rubygems: latest
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: |
          bin/rails db:prepare
          bin/rails test
          bin/rails test:system

      - name: Run pre-release product scenarios
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails test test/integration/pre_release_scenarios_test.rb

      - name: Check release configuration task
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          APP_HOST: petjournal.example
          SECRET_KEY_BASE: test-secret-key-base
          LEGAL_OPERATOR_NAME: PetJournal Test Operator
          LEGAL_OPERATOR_EMAIL: privacy@petjournal.example
          MAIL_FROM: PetJournal <no-reply@petjournal.example>
          SMTP_ADDRESS: smtp.example
          SMTP_DOMAIN: petjournal.example
          SMTP_USER_NAME: test
          SMTP_PASSWORD: test
        run: bin/rails release:check

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  ssh_check:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/auto-deploy'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Check NetAngels connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          printf '%s\n' "$DB_CONNECTION_STRING" | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "\
            set -e; \
            IFS= read -r DB_CONNECTION_STRING; \
            export DB_CONNECTION_STRING; \
            test \"\$(whoami)\" = '$DEPLOY_USER'; \
            ROOT=\"\$(dirname '$DEPLOY_PATH')\"; \
            export GEM_HOME=\"\$ROOT/gems/ruby3.1\"; \
            export GEM_PATH=\"\$GEM_HOME:/usr/lib/ruby/gems/3.1.0:/usr/lib/x86_64-linux-gnu/rubygems-integration/3.1.0:/usr/share/rubygems-integration/all\"; \
            export PATH=\"\$ROOT/bin:\$HOME/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:\$GEM_HOME/bin\"; \
            export RUBY_VERSION=ruby-3.1.2; \
            cd '$DEPLOY_PATH'; \
            ruby -v; \
            bundle -v; \
            test -n \"\$DB_CONNECTION_STRING\"; \
            echo 'NetAngels SSH check passed'"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [scan_ruby, scan_js, lint, test]
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to NetAngels
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          printf '%s\n' "$DB_CONNECTION_STRING" | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "\
            set -e; \
            IFS= read -r DB_CONNECTION_STRING; \
            export DB_CONNECTION_STRING; \
            ROOT=\"\$(dirname '$DEPLOY_PATH')\"; \
            export GEM_HOME=\"\$ROOT/gems/ruby3.1\"; \
            export GEM_PATH=\"\$GEM_HOME:/usr/lib/ruby/gems/3.1.0:/usr/lib/x86_64-linux-gnu/rubygems-integration/3.1.0:/usr/share/rubygems-integration/all\"; \
            export PATH=\"\$ROOT/bin:\$HOME/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:\$GEM_HOME/bin\"; \
            export RUBY_VERSION=ruby-3.1.2; \
            cd '$DEPLOY_PATH'; \
            git fetch origin main; \
            git reset --hard '$GITHUB_SHA'; \
            test \"\$(git rev-parse HEAD)\" = '$GITHUB_SHA'; \
            BUNDLE_FROZEN=true bundle install; \
            RAILS_ENV=production bin/rails assets:precompile; \
            RAILS_ENV=production bin/rails db:migrate release:check; \
            touch ../reload"

      - name: Verify production health
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://pet-journal.ru/up
