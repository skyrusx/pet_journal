<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07392f">
  <meta name="color-scheme" content="light">
  <title>PetJournal — нет связи</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #f7f1e5; color: #14352d; }
    body { min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
    main { width: min(460px, 100%); text-align: center; }
    .mark { width: 92px; height: 92px; display: grid; place-items: center; margin: 0 auto 24px; border-radius: 26px; background: #07392f; box-shadow: 0 22px 50px rgba(7, 57, 47, .16); }
    .mark svg { width: 54px; height: 54px; }
    .eyebrow { margin-bottom: 8px; color: #66756f; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; color: #07392f; font-family: Georgia, "Times New Roman", serif; font-size: clamp(30px, 8vw, 40px); font-weight: 400; line-height: 1.15; }
    p { margin: 14px auto 0; max-width: 390px; color: #66756f; font-size: 15px; line-height: 1.6; }
    .note { margin-top: 14px; color: #456955; font-size: 13px; }
    button { min-height: 46px; margin-top: 26px; padding: 0 22px; border: 0; border-radius: 10px; background: #07392f; color: #fffdf8; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 12px 28px rgba(7, 57, 47, .16); }
    button:active { transform: scale(.98); }
    footer { margin-top: 34px; color: #8a938e; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <ellipse cx="20" cy="20" rx="7" ry="9" transform="rotate(-24 20 20)" fill="#fffdf8"/>
        <ellipse cx="32" cy="15" rx="7" ry="9" fill="#fffdf8"/>
        <ellipse cx="44" cy="20" rx="7" ry="9" transform="rotate(24 44 20)" fill="#fffdf8"/>
        <ellipse cx="51" cy="32" rx="6" ry="8" transform="rotate(34 51 32)" fill="#fffdf8"/>
        <path d="M32 27C20 27 10 36 10 46c0 8 6 13 15 13 5 0 7-2 10-2s5 2 10 2c9 0 15-5 15-13 0-10-16-19-28-19Z" fill="#fffdf8"/>
        <path d="M32 39c4-5 11-1 8 5-2 4-8 7-8 7s-6-3-8-7c-3-6 4-10 8-5Z" fill="#c8f43f"/>
      </svg>
    </div>
    <div class="eyebrow">PetJournal offline</div>
    <h1>Кажется, связь потерялась</h1>
    <p>Проверьте интернет и попробуйте ещё раз. Личные данные PetJournal специально не сохраняются в offline-кэш на этом устройстве.</p>
    <div class="note">Как только соединение вернётся, страницу можно открыть снова.</div>
    <button type="button" onclick="location.reload()">Попробовать снова</button>
    <footer>PetJournal · Всё важное о питомце — рядом.</footer>
  </main>
  <script>
    window.addEventListener("online", function () { window.location.reload(); });
  </script>
</body>
</html>
