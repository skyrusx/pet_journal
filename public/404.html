<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#fffdf8">
  <title>Страница не найдена — PetJournal</title>
  <link rel="stylesheet" href="/petjournal/errors/error-pages.css?v=12">
  <link rel="stylesheet" href="/petjournal/errors/error-pages-reference.css?v=14">
  <link rel="stylesheet" href="/petjournal/errors/error-header-landing.css?v=1">
</head>
<body class="pj-error-page pj-error-page--404">
  <header class="pj-error-header">
    <div class="pj-error-shell">
      <a href="/" class="pj-error-brand" aria-label="PetJournal — на главную">
        <img src="/petjournal/errors/logo.svg" class="pj-error-logo" width="166" height="49" alt="PetJournal">
      </a>

      <nav class="pj-error-navbar__nav" aria-label="Основная навигация">
        <a href="/#features">Возможности</a>
        <a href="/#how-it-works">Как это работает</a>
      </nav>

      <div class="pj-error-navbar__actions">
        <a href="/users/sign_in" class="pj-error-navbar__login">Войти</a>
        <a href="/users/sign_up" class="pj-error-navbar__cta">Создать журнал</a>
      </div>

      <details class="pj-error-navbar__mobile">
        <summary aria-label="Открыть меню">
          <span class="pj-error-navbar__burger" aria-hidden="true"><span></span></span>
        </summary>

        <div class="pj-error-navbar__mobile-panel">
          <div class="pj-error-navbar__mobile-card">
            <nav class="pj-error-navbar__mobile-nav" aria-label="Мобильная навигация">
              <a href="/#features">Возможности</a>
              <a href="/#how-it-works">Как это работает</a>
            </nav>

            <div class="pj-error-navbar__mobile-separator" aria-hidden="true"></div>

            <div class="pj-error-navbar__mobile-actions">
              <a href="/users/sign_in" class="pj-error-navbar__mobile-login">Войти</a>
              <a href="/users/sign_up" class="pj-error-navbar__mobile-cta">Создать журнал</a>
            </div>
          </div>
        </div>
      </details>
    </div>
  </header>

  <main class="pj-error-main">
    <section class="pj-error-card" aria-labelledby="pj-error-title">
      <img src="/petjournal/errors/error-404.webp?v=14"
           class="pj-error-illustration"
           width="670" height="330"
           alt="Собака и кошка PetJournal">
      <h1 class="pj-error-title" id="pj-error-title">Такой страницы нет</h1>
      <p class="pj-error-copy">Возможно, ссылка устарела или адрес введён с ошибкой.</p>
      <div class="pj-error-actions">
        <a href="/" class="pj-error-primary">На главную</a>
        <button type="button" class="pj-error-secondary" onclick="pjGoBack()">Вернуться назад</button>
      </div>
    </section>
  </main>

  <footer class="pj-error-footer">
    <span>© 2026 PetJournal. Все права защищены.</span>
    <span class="pj-error-footer__care">Сделано с заботой о тех, кто рядом ♡</span>
  </footer>

  <script>
    function pjGoBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/";
      }
    }
  </script>
</body>
</html>
