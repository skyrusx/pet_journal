<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#fffdf8">
  <title>Что-то пошло не так — PetJournal</title>
  <link rel="stylesheet" href="/petjournal/errors/error-pages.css?v=10">
</head>
<body class="pj-error-page pj-error-page--500">
  <header class="pj-error-header">
    <div class="pj-error-shell">
      <a href="/" class="pj-error-brand" aria-label="PetJournal — на главную">
        <img src="/petjournal/errors/logo.svg" class="pj-error-logo" width="166" height="49" alt="PetJournal">
      </a>
    </div>
  </header>
  <main class="pj-error-main">
    <section class="pj-error-card" aria-labelledby="pj-error-title">
      <img src="/petjournal/errors/error-500.svg?v=10" class="pj-error-illustration" width="576" height="297" alt="Собака и кошка рядом с символом системной ошибки PetJournal">
      <h1 class="pj-error-title" id="pj-error-title">Что-то пошло не так</h1>
      <p class="pj-error-copy">Мы не смогли открыть эту страницу. Попробуйте немного позже.</p>
      <div class="pj-error-actions">
        <button type="button" class="pj-error-primary" onclick="window.location.reload()">Попробовать снова</button>
        <a href="/" class="pj-error-secondary">На главную</a>
      </div>
    </section>
  </main>
  <footer class="pj-error-footer">
    <span>© 2026 PetJournal. Все права защищены.</span>
    <span class="pj-error-footer__care">Сделано с заботой о тех, кто рядом ♡</span>
  </footer>
</body>
</html>
