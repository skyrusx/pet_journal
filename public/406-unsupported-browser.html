<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#fffdf8">
  <title>Обновите браузер — PetJournal</title>
  <link rel="stylesheet" href="/petjournal/errors/error-pages.css?v=12">
</head>
<body class="pj-error-page pj-error-page--406">
  <header class="pj-error-header">
    <div class="pj-error-shell">
      <a href="/" class="pj-error-brand" aria-label="PetJournal — на главную">
        <img src="/petjournal/errors/logo.svg" class="pj-error-logo" width="166" height="49" alt="PetJournal">
      </a>
    </div>
  </header>

  <main class="pj-error-main">
    <section class="pj-error-card" aria-labelledby="pj-error-title">
      <img src="/petjournal/errors/error-406.webp?v=12"
           class="pj-error-illustration"
           width="670" height="330"
           alt="Собака и кошка рядом с окном браузера PetJournal">
      <h1 class="pj-error-title" id="pj-error-title">Ваш браузер нужно обновить</h1>
      <p class="pj-error-copy">PetJournal использует современные возможности браузера<br class="pj-error-copy-break"> для корректной и безопасной работы.</p>
      <div class="pj-error-actions">
        <a href="https://browser-update.org/update-browser.html" class="pj-error-primary" target="_blank" rel="noopener noreferrer">Обновить браузер</a>
        <a href="/" class="pj-error-secondary">На главную</a>
      </div>
    </section>
  </main>

  <footer class="pj-error-footer">
    <span>© 2026 PetJournal. Все права защищены.</span>
    <span class="pj-error-footer__care">Сделано с заботой о тех, кто рядом ♡</span>
  </footer>
</body>
</html>
